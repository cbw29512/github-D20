name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# Exact-head certification for RAW combat, source parity, figure identity, full SRD roster visibility, six-slot UI, Battle Lab, and Pages root entry.
jobs:
  combat-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Enforce production source limits
        run: python scripts/check_source_limits.py
      - name: Enforce combat capability coverage
        run: |
          python scripts/check_combat_engine_coverage.py
          python scripts/export_roster_mechanic_checklist.py --check
      - name: Enforce declarative monster source of truth
        run: |
          python scripts/export_runtime_monster_capabilities.py --check
          ! grep -Eq 'app\.content\.(legacy_monster_roster|monster_|monsters_)' backend/app/content/roster.py
      - name: Generate canonical hero artifact
        run: python scripts/export_browser_heroes.py
      - name: Upload canonical hero artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-heroes-${{ github.sha }}
          path: frontend/browser-heroes.js
          retention-days: 1
      - name: Generate canonical monster artifact
        run: python scripts/export_browser_monsters.py
      - name: Upload canonical monster artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-monsters-${{ github.sha }}
          path: frontend/browser-monsters-generated.js
          retention-days: 1
      - name: Generate certification manifest candidates
        run: python scripts/verify_certification_manifests.py --write
      - name: Upload certification manifest candidates
        uses: actions/upload-artifact@v4
        with:
          name: certification-manifests-${{ github.sha }}
          path: |
            data/hero_certification_manifest.json
            data/monster_certification_manifest.json
          retention-days: 1
      - name: Enforce durable certification manifest parity
        run: |
          git diff --exit-code -- data/hero_certification_manifest.json data/monster_certification_manifest.json
          python scripts/report_certification_progress.py
      - name: Report zero-engine monster candidates
        run: python scripts/report_zero_engine_monsters.py
      - name: Report capability blocker yields
        run: python scripts/report_capability_yield.py
      - name: Prepare static browser package
        run: |
          python scripts/prepare_static_site.py
          test -s frontend/data/srd_5_2_1_monsters.json
          test -s frontend/browser-monsters-generated.js
          test -s frontend/browser-spell-effects.js
          grep -q '"id":"bless"' frontend/browser-spell-effects.js
      - name: Upload canonical static artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-static-${{ github.sha }}
          path: |
            frontend/browser-heroes.js
            frontend/browser-monsters-generated.js
            frontend/browser-spell-effects.js
            frontend/data/srd_5_2_1_monsters.json
          retention-days: 1
      - name: Enforce generated static parity
        run: |
          git diff --exit-code -- frontend/browser-heroes.js frontend/figure-profiles.js frontend/browser-monsters-generated.js frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json
          test -z "$(git status --porcelain --untracked-files=all -- frontend/browser-monsters-generated.js frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json)"
      - name: Certify Python rules reference
        working-directory: backend
        run: pytest -q
      - name: Validate browser JavaScript syntax
        run: |
          for file in frontend/*.js; do node --check "$file"; done
      - name: Run browser combat regressions
        run: |
          node frontend/battle-lab.test.cjs
          node frontend/browser-dice-recording.test.cjs
          node frontend/browser-engine.test.cjs
          node frontend/browser-formation.test.cjs
          node frontend/browser-conditional-damage.test.cjs
          node frontend/browser-swarm.test.cjs
          node frontend/browser-rage.test.cjs
          node frontend/browser-barbarian3.test.cjs
          node frontend/browser-sneak-attack.test.cjs
          node frontend/browser-vex.test.cjs
          node frontend/browser-graze.test.cjs
          node frontend/browser-topple.test.cjs
          node frontend/browser-light-weapons.test.cjs
          node frontend/browser-defense-style.test.cjs
          node frontend/browser-fighter-progression.test.cjs
          node frontend/browser-fighter9.test.cjs
          node frontend/browser-heroic-inspiration.test.cjs
          node frontend/browser-champion.test.cjs
          node frontend/browser-fighter4.test.cjs
          node frontend/browser-fighter5.test.cjs
          node frontend/browser-beast2.test.cjs
          node frontend/browser-batch3.test.cjs
          node frontend/browser-deathmatch.test.cjs
          node frontend/browser-zero-hp-lifecycle.test.cjs
          node frontend/browser-undead-fortitude.test.cjs
          node frontend/browser-control.test.cjs
          node frontend/browser-poison.test.cjs
          node frontend/browser-mixed-damage.test.cjs
          node frontend/browser-venom.test.cjs
          node frontend/browser-mixed-multiattack.test.cjs
          node frontend/browser-expansion.test.cjs
          node frontend/browser-generated-monsters.test.cjs
          node frontend/browser-creature-types.test.cjs
          node frontend/browser-monster-saves.test.cjs
          node frontend/browser-condition-immunity.test.cjs
          node frontend/browser-action-healing.test.cjs
          node frontend/browser-action-condition.test.cjs
          node frontend/browser-condition-lifecycle.test.cjs
          node frontend/browser-condition-removal.test.cjs
          node frontend/browser-reactions.test.cjs
          node frontend/browser-parry-effective-ac.test.cjs
          node frontend/browser-reaction-movement.test.cjs
          node frontend/browser-spell-area.test.cjs
